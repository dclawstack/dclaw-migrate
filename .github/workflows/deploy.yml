name: Deploy

on:
  workflow_run:
    workflows: ["Build Backend", "Build Frontend"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.x"

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Determine image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || 'sha-' }}${{ github.sha }}"
          # workflow_dispatch with explicit tag uses that; push uses SHA
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy via Helm
        run: |
          helm upgrade --install dclaw-migrate ./helm/dclaw-migrate \
            --namespace dclaw \
            --create-namespace \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --set ingress.enabled=true \
            --wait \
            --timeout 5m
