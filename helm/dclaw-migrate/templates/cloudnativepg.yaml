{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "dclaw-migrate.fullname" . }}-pg
  labels:
    {{- include "dclaw-migrate.labels" . | nindent 4 }}
spec:
  instances: 1

  storage:
    size: {{ .Values.postgresql.storage | default "10Gi" }}

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: dclaw_migrate
      owner: dclaw_migrate
      secret:
        name: {{ include "dclaw-migrate.fullname" . }}-pg-superuser

  monitoring:
    enablePodMonitor: false
{{- end }}
