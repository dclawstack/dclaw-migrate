replicaCount: 1

image:
  repository: ghcr.io/dclawstack/dclaw-migrate
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 8121

ingress:
  enabled: true
  className: nginx
  host: migrate.dclawstack.io

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

postgresql:
  enabled: true
  storage: 10Gi

serviceAccount:
  create: true
  annotations: {}
  name: ""
